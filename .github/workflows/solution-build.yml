          # silent, because a smaller green number reads exactly like a full one.
          echo
          echo "Optional components (guarded by if(EXISTS) in the top-level CMakeLists.txt):"
          absent=""
          for d in TreeFs DspChain P2PeerFs P2PeerUtilityHubs MscsUnitTestsExternal; do
            if [ -e "mscs/$d/CMakeLists.txt" ]; then
              echo "  present  $d"
            else
              echo "  ABSENT   $d   (its tests are NOT in the ctest total below)"
              absent="$absent $d"
            fi
          done
          if [ -n "$absent" ]; then
            echo
            echo "  THE CTEST TOTAL BELOW IS A PARTIAL SUITE. Absent:$absent"
            echo "  A build with every component present runs 65 tests, and 20 of those"
            echo "  are built by MscsUnitTestsExternal alone (every dsp_*, every util_*,"
            echo "  and unit_suite_external). Do not read this run total as the suite."
            echo "  The security label is unaffected: all 29 of its tests live in"
            echo "  MscsUnitTests (seal_interop moves to Targetcore off Windows), both of"
            echo "  which are present, so the sanitizer workflow measures what it claims."
          fi

      # liburing for the io_uring implementation of the p2p_iocp_* hooks,
      # OpenSSL 3 for the crypto backend, ninja for the linux-gcc-debug preset.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config liburing-dev libssl-dev

      - name: Configure
        run: cmake --preset linux-gcc-debug
        working-directory: mscs

      - name: Build
        run: cmake --build --preset linux-gcc-debug
        working-directory: mscs

      # Linux resolves the .so through the build-tree RPATH, so this has never
      # had the Windows loader-path problem. Run it the same clean way anyway:
      # the loader-path fix sets LD_LIBRARY_PATH here too, and if RPATH is ever
      # turned off this is what notices.
      - name: Test
        run: >
          ctest --test-dir build/linux-gcc-debug
          --output-on-failure --output-junit ctest-linux.xml ${{ inputs.ctest_args }}
        working-directory: mscs

      - name: Upload the ctest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux
          path: mscs/ctest-linux.xml
          if-no-files-found: warn
