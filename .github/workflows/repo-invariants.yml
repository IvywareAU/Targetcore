# =============================================================================
# repo-invariants -- everything this repository can verify ABOUT ITSELF.
#
# READ THIS BEFORE TRUSTING A GREEN TICK FROM THIS WORKFLOW.
#
# TargetCore does not build on its own and this workflow does not pretend it
# does. `..\Msgcore` -- which carries `Platform\` inside it since 2026-09-03, when
# that repository was retired -- is a peer directory in a parent solution that is
# not published alongside this repository; it is not a submodule and not vendored
# here, and `WDMSCS_LIB` is an environment variable pointing at wherever
# the caller stages import libraries. Readme.md "The sibling dependencies"
# documents all four bindings. The consequence for CI is blunt:
#
#   *** THE LIBRARY ITSELF IS NEVER COMPILED BY THIS WORKFLOW. ***
#
# A workflow that is green while verifying nothing is worse than no workflow, so
# this one is scoped to claims it can actually discharge, and each job states
# its own limits below. What the sibling-complete build proves is proved by
# solution-build.yml, which is workflow_dispatch-only precisely so that it can
# never contribute a green tick to a pull request without a human deciding to
# run it and supplying the siblings.
#
# The three jobs, and the whole of what they establish:
#
#   invariants      The two build systems (vcxproj and CMakeLists) describe the
#                   same set of source files; every source named exists; no .cpp
#                   in the tree is orphaned; the deleted legacy crypto has not
#                   returned as a build input; the shipped Markdown does not
#                   link to files that are gone; the legal/release files exist.
#                   Bookkeeping only -- nothing is compiled.
#
#   crypto-selftest The one job that RUNS library code. Four TUs in this repo
#                   depend on nothing but OpenSSL 3, so the crypto/identity/
#                   login/seal core is compiled and its own KATs and refusal
#                   paths are executed. OpenSSL backend only -- the CNG backend
#                   cannot be built standalone (P2PCngCrypto.cpp includes
#                   stdafx.h, which reaches ../Msgcore/Platform and MFC), so this proves
#                   nothing about Windows and nothing about whether the two
#                   backends agree on the wire.
#
#   cmake-parse     CMakeLists.txt is valid CMake and generates, against stub
#                   sibling targets. Configure only; nothing is compiled.
#
# What NO job here covers, stated plainly so the gap is on the record:
#   * The routing kernel, the hubs, the pumps, all four transports, the C API --
#     26 of the 30 translation units are never even parsed.
#   * The CNG crypto backend, and therefore Windows/Linux wire compatibility.
#   * The TargetCore(2026).vcxproj/.sln build, which Readme.md calls
#     authoritative on Windows. CI never invokes MSBuild.
#   * The MscsUnitTests suite -- unit_suite, the transport meshes, alex_test,
#     and the five security gate tests all live in a sibling repository.
# =============================================================================

name: repo invariants (standalone, siblings NOT required)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Bookkeeping the repository can check about itself. See the header of
  # .github/ci/check_repo_invariants.py for the full proves/does-not-prove list.
  # The check with teeth is build-system parity: a .cpp added to
  # TargetCore(2026).vcxproj but not to CMakeLists.txt (or the reverse) means
  # the Windows and Linux builds ship different libraries, and nothing else in
  # the tree compares the two lists. MscsUnitTests/CMakeLists.txt:23-25 records
  # the same failure mode going unnoticed for 14 days on a test suite.
  # ---------------------------------------------------------------------------
  invariants:
    name: repository invariants (no compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check repository invariants
        run: python3 .github/ci/check_repo_invariants.py

  # ---------------------------------------------------------------------------
  # The only executable verification possible without the siblings.
  #
  # It is a real gate, not a smoke test: p2pcng::SelfTest covers the AES-256-GCM
  # / ECDH P-256 / ECDSA P-256 / HKDF-SHA256 / HMAC-SHA256 known-answer vectors,
  # and the other three round-trip the identity container, the signed login and
  # the end-to-end seal through real files INCLUDING their refusal paths
  # (corruption, truncation, unknown peer, wrong key, tampered signature,
  # replay, clock skew, wrong recipient, moved address pair, flipped bit).
  #
  # And it is narrow: 4 translation units of 30, one of the two crypto backends,
  # and no transport. Do not read a green run here as "the crypto is verified" --
  # read it as "the OpenSSL backend still passes its own tests". Cross-backend
  # agreement is seal_interop's job and needs the sibling checkout; running only
  # one backend's self-tests is exactly the reasoning that lets a divergence
  # between the two ship unnoticed.
  # ---------------------------------------------------------------------------
  crypto-selftest:
    name: crypto core self-test (OpenSSL backend, 4 of 30 TUs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install OpenSSL 3 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev

      - name: Record toolchain identity
        run: |
          g++ --version | head -1
          openssl version

      # No -fpermissive here, deliberately. The legacy TUs need it for their
      # MSVC-lax member-pointer forms; these four are clean C++23 and must stay
      # that way, so a new dependency on the legacy dialect fails this job.
      - name: Build the standalone crypto core
        run: |
          g++ -std=c++23 -O1 -Wall -Wextra -Wno-unused-parameter \
              -I. \
              -o crypto_selftest \
              .github/ci/crypto_selftest.cpp \
              P2PCngCrypto_openssl.cpp \
              P2PIdentityStore.cpp \
              P2PAuthLogin.cpp \
              P2PeerSeal.cpp \
              -lcrypto

      - name: Run the self-tests
        run: ./crypto_selftest

  # ---------------------------------------------------------------------------
  # Configure-only. Proves CMakeLists.txt parses and generates and that every
  # source its WIN32 branch names is present; proves nothing about compiling.
  # The stub parent that makes this possible is .github/ci/parse-check, and its
  # header explains why a green result here is NOT "the repo builds standalone".
  #
  # Windows-only on purpose: the Linux branch of CMakeLists.txt compiles
  # ../Msgcore/Platform/p2piocp.cpp, which is in a sibling repository, so a Linux
  # parse-check would fail for a reason that is not a defect.
  # ---------------------------------------------------------------------------
  cmake-parse:
    name: CMakeLists.txt generates (stub siblings, configure only)
    # windows-2025-vs2026, NOT windows-latest. The label moved off the VS 2026 image and
    # the step below asks for the "Visual Studio 18 2026" generator by name, so on
    # windows-latest cmake answers "could not find any instance of Visual Studio"
    # -- a red job that says nothing about CMakeLists.txt. Pinning is what the
    # sibling Msgcore ci.yml does for the same reason. Changing the generator to
    # track the label instead would be the wrong repair: the parent solution's
    # windows-msvc preset also names "Visual Studio 18 2026", so this job would
    # stop parse-checking the toolchain the real build actually uses.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5

      - name: Configure against stub sibling targets
        run: >
          cmake -S .github/ci/parse-check -B ${{ runner.temp }}/parse-check
          -G "Visual Studio 18 2026" -A x64

      # There is no build step and there must never be one: the stub sibling
      # targets are empty INTERFACE libraries, so the generated project cannot
      # compile a single TU. If someone adds `cmake --build` here, the job
      # starts failing for the right reason and the wrong one at once.
      - name: State what was and was not verified
        shell: bash
        run: |
          echo "CMakeLists.txt configured and generated successfully."
          echo "NOT verified: compilation, linking, or any behaviour."
