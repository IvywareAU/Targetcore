# =============================================================================
# sanitizers -- ASan on Windows, ASan+UBSan+LSan on Linux, on every push.
#
# Stage 1 step 5. The premise of that step, quoted:
#
#     "ASan found four out-of-bounds on the receive path on 2026-08-15 -- one a
#      WRITE -- none of them inside an ASSERT, so all four were live in Release
#      and silent there. That run was manual and the last one is now four
#      commits stale."
#
# Manual is the defect. A sanitizer that runs when somebody remembers is a
# sanitizer that reports on whatever the tree happened to be that afternoon, and
# the four commits of drift are how you get a "clean" claim that describes code
# nobody is running any more.
#
# WHAT THIS FOUND THE FIRST TIME IT RAN (2026-08-18)
#
# The fuzz harness had been under ASan before. The `security` label never had.
# The first run of the label under a sanitizer failed 8 of 15 tests:
#
#   * new[]/delete mismatch -- Msgcore/P2PmsgBSTR.cpp:595 released an image that
#     P2Piomage_Alloc built with `new char[]`. FIXED in the same commit as this
#     file; one line. It accounted for 5 of the 8 failures and, indirectly, for
#     all 6 UBSan misaligned-wchar_t reports, which vanished with it.
#   * heap-buffer-overflow, READ 2040 bytes -- p2p_bigreport. FIXED 2026-08-19,
#     Msgcore, one line: P3PmsgBSTR::P2PiomageSize() added sizeof(oSync) to a
#     field that already counted it, so every caller read one header past the
#     image -- harmless off a VBHeap with slack, and 8 bytes of adjacent heap
#     into a reply sent to the peer when the message came off the wire.
#   * heap-use-after-free, cross-thread -- p2p_expreg. FIXED 2026-08-19 as
#     F-S5-2.  Fixing it exposed a leak that had been sitting behind the abort
#     (F-S5-4), and closing that exposed a dangling registry entry behind THAT
#     (F-S5-5).  All three are closed; the test now runs clean under
#     ASan+UBSan+LSan with detect_leaks=1.
#
# THE EXCLUSION LIST IS NOW EMPTY, WHICH IS WHY THIS SECTION IS SHORTER
#
# It used to read: "`p2p_expreg` fails under ASan today.  It is excluded from
# the GATING ctest run and then run again, by name, in a step that prints its
# full sanitizer report", and it promised that when the finding was closed, the
# name and the `known findings` step would be deleted and the gate would widen
# by itself.  That has now happened twice and nothing is left on the list:
#
#   * p2p_bigreport came off on 2026-08-19 when F-S5-1 was fixed;
#   * p2p_expreg came off the same day, once F-S5-4 and F-S5-5 took it from
#     34,529 bytes leaked in 18 allocations to zero.
#
# So the gate now runs the WHOLE security label with nothing excluded: no -E, no
# WILL_FAIL, no `|| true`, and no reports-only step for a reader to notice.
# Every test in the label gates on every push, on both platforms.
#
# If a finding is ever raised again, restore the pattern rather than inventing
# one: a named exclusion in plain sight plus a non-gating step that prints the
# report, so "known" can never quietly become "acceptable" - the same bargain
# Stage 1 step 4 struck for the fuzz assert tally.
#
# TWO OPTIONS THAT MUST NOT BE ADDED, both measured on 2026-08-18
#
#   ASAN_OPTIONS=...:halt_on_error=0
#       LSan prints a complete leak report and the process still exits 0. The
#       run goes green with the leak in the log. This is a very tempting flag
#       when you are trying to enumerate findings instead of stopping at the
#       first, which is exactly when it does the damage.
#
#   UBSAN_OPTIONS without halt_on_error=1
#       UBSan's default is print-and-continue, so a "runtime error:" line does
#       NOT fail the test. Two tests passed while printing six of them. Every
#       UBSan invocation here therefore sets halt_on_error=1.
#
# TSAN, WIRED IN 2026-09-17, AND ALL SIX OF ITS FINDINGS CLOSED BY 2026-09-18
#
# The preset had existed unrun since the pump/hub race gate was deferred to
# Stage 2. Running it found 10 of 38 security tests failing and 27 reports,
# which reduced to SIX defects. The whole label now runs under TSan with ZERO
# reports and nothing excluded.
#
# Every one is kept below, closed and written out, because a defect that
# disappears from the record takes its lesson with it - and four of the six
# taught something that is not in the diff. The arc, measured serially on
# gcc 15.2 and confirmed on the runner's 13.3 at each step:
#
#     27 reports, 10 failing   the first run
#     20 reports, 10 failing   the event's happens-before edge (3)
#     17 reports,  9 failing   close-before-destroy (2)
#     10 reports,  4 failing   the accept counters (5)
#      7 reports,  3 failing   the registry lock order (1)
#      0 reports,  0 failing   the three harness races (4 and 6)
#
# THE SIX:
#
#   1. CLOSED 2026-09-18. AB-BA LOCK-ORDER INVERSION, hub registry against pump
#      registry, six reports. Both sides were plain in the source:
#      CreateP2PmsgHub took s_oCSectionP2PmsgHub then s_oCSectionP2PmsgPump, and
#      five functions took them the other way round - CreateP2Pexpump,
#      CloseP2Pexpump, PostP2PexpCon, EnumP2PexpCon, CloseP2PmsgPump. Ten sites
#      already read hub-first, so hub-first is now THE order and it is written
#      down at the declaration of s_oCSectionP2PmsgHub.
#      THE TRICK IT TURNED ON, because it looks impossible at first: all five
#      inverted sites have to look a pump up before they can name the hub, which
#      seems to force pump-first. It does not. These locks guard the REGISTRIES,
#      not a hub, so the hub lock can be taken before anyone knows which hub is
#      wanted. The lookups did not move at all; only the guards did.
#      AND A SECOND HALF THAT WAS EASY TO MISS. Three of the five then did
#      `oSafeCS_Hub = pP2PmsgHub->m_oCSection`, which RELEASES the hub registry
#      to take the hub's own CS - so a later DropP2PmsgCon re-took the registry
#      with the pump registry still held, and the cycle was back. They now hold
#      both in a second guard; the CS is recursive, so the re-entry is free.
#      Fixing that also closed two DeleteCriticalSection races in p2p_expreg
#      that had been sitting behind the inversion: CloseP2PmsgHub was deleting
#      a P2PmsgHubMgr while CloseP2Pexpump still held that hub's CS.
#      Same CLASS as the AB-BA fixed in 4236949 on 2026-07-10, different pair:
#      that one was a transport CS against the pump registry, so only
#      Dmx/Pipe/232 tripped it. This was the two global registries against each
#      other, which no transport can avoid.
#      p2p_expreg, p2p_hubsnap, p2p_backpressure.
#   2. FIXED 2026-09-18, and it was a CONTRACT rather than a lock. VPTR RACE,
#      ~P2PeerHub (P2PeerHub.cpp:101) against ProcHub (:499) still dispatching
#      virtuals through the object. The vtable pointer is rewritten on ENTRY to
#      the base destructor, so ~P2PeerHub's own CloseHub() - which is what made
#      this look closed - runs two steps too late: the derived object is gone
#      and the pump thread has already been dispatching through both halves.
#      One of the two reports caught it mid-seal, inside P2PeerCon::GetAuthHub
#      from SealAppMsgOutbound. No base destructor can close that window; the
#      owner has to CloseHub() before destruction begins. ~P2PeerHub now says
#      so out loud when it catches one, p2peerhub_destroy and ~P2PeerService
#      do it for the owners who have no destructor of their own, and the one
#      test that violated it does it too. p2p_e2ewaive.
#      WHAT THE CHECK FOUND is the part worth keeping: run against all 72 tests
#      it fired in ONE, seven times, and nowhere else. Every other hub in the
#      tree already closed before it died, and P2PeerEvents has had CloseHub()
#      in its destructor since long before any of this with a comment saying
#      why. The contract was already house practice - never stated, never
#      checked, and with exactly one place where it lapsed.
#   3. FIXED 2026-09-17, Msgcore, in the event primitive itself. CloseHandle
#      (p2pfile.h:425, from ~P2PeerHub:120) against SetEvent (p2pthread.h:109,
#      from SignalHubExit:457) on the hub-exit handle - seven reports, the
#      largest cluster, plus the two DeleteCriticalSection reports and the one
#      on m_hHubExit itself. The handle body was already race-aware
#      (retired.load(acquire), fd.exchange) and that was never the problem: the
#      MANUAL-RESET wait only poll()ed the eventfd and never read it, so it
#      published no happens-before edge at all and CloseHub's wait ordered
#      nothing. A generation counter now carries the edge - refer P2PEventImpl
#      in Msgcore/Platform/p2pthread.h, which has the long version.
#   4. CLOSED 2026-09-18. closesocket (p2psock.h:191) against concurrent use.
#      NOT the socket analogue of 3, which is what this line said until it was
#      read properly: all three reports are inside the harness. main closed the
#      relay sockets while RelayC2S and RelayS2C were still blocked in recv() -
#      closing does break a blocked recv() out, and it also takes the descriptor
#      away from a thread still inside a call on it. Now: shutdown() all three,
#      join, THEN close. The third report was g_bRelayStop, a `volatile bool`
#      that volatile never made safe to share. p2p_authrelay.
#   5. CLOSED 2026-09-18. ACCEPT-PATH COUNTERS unsynchronised: AcceptAtCapacity
#      (P2PeerCon.h:253) and AcceptSpawn (P2PeerCon.cpp:365, :368) read on the
#      pump thread what SetMaxAccepted (:1597) and SetLoginDeadline (:1650)
#      write on the owner thread. m_xMaxAccepted, m_xMaxAcceptedPerSource and
#      m_xLoginDeadline are now std::atomic, and the two capacity tests take ONE
#      load of the bound rather than two - read twice, a setter landing between
#      them answers "bounded" to the first and compares against a different
#      number in the second.
#      THE THIRD FIELD WAS NOT A COUNTER but a lazy allocation: m_pxAccepted and
#      m_pxSourceTally were built on the first AcceptSpawn(), on the pump thread,
#      while the owner read the same pointer through GetAcceptedCount()'s bare
#      `m_pxAccepted ? ...`. They are allocated in the constructor now. That is
#      one 32-byte control block on a connection that never accepts anything,
#      against a data race, and nothing cheaper fixes it without putting a lock
#      on the accept path. p2p_srcbound, p2p_conreap, p2p_logindeadline.
#   6. CLOSED 2026-09-18. TEST-HARNESS races, in MscsUnitTests rather than the
#      library, and both the same mistake: a counter incremented atomically and
#      then read or reset plainly. p2p_replayguard's g_nOpened/g_nReplay/g_nOther
#      were `volatile LONG` bumped with InterlockedIncrement - the increments
#      were always atomic, the reads on the main thread never were, and the
#      InterlockedIncrement beside them made it look handled. p2p_fuzzframe's
#      g_nProgress was a `volatile unsigned long` shared with the watchdog
#      thread. All four are std::atomic now. VOLATILE IS NOT A SYNCHRONISATION
#      PRIMITIVE, which is the only lesson here and is worth the four lines.
#
# TSan NAMED THE FIRST ONE ITSELF, which is the thing to remember about reading
# these reports. Above the stacks for 2, 3 and 4 it printed "As if synchronized
# via sleep" - the Sleep(1) in YieldForP2PmsgPump was the only thing sequencing
# the two threads, and a sleep is a bet on the other thread being quick rather
# than a synchronisation primitive.
#
# THE READING THAT WAS WRONG, kept because it cost a day and would cost it
# again. Those three were first written down here as ONE defect wearing three
# hats, on the strength of that shared line. They were three. Fixing 3 left 2
# and 4 standing exactly where they were, which is the only reason anybody
# looked again: 4 turned out to be in the harness and 2 turned out to be a
# contract, and neither had anything to do with the sleep. A shared symptom in
# a sanitizer report is not a shared cause, and the way to tell is to fix one
# and re-measure rather than to reason about it.
#
# THE OTHER THREE ALL HAD THE SAME SHAPE, once 1, 5 and 6 were laid side by
# side: something WAS synchronised, visibly, and the thing beside it was not.
# InterlockedIncrement on a counter read plainly. An atomic<long> behind a
# shared_ptr assigned unguarded. A lock order obeyed by ten sites and inverted
# by five. Every one of them looked handled at a glance, which is exactly why
# a sanitizer found them and reading did not.
#
# WHAT WAS NOT A FINDING, recorded so nobody re-derives it: at -j4 two further
# tests, p2p_sealbcast and p2p_listenscope, failed with EADDRINUSE (system error
# 98) rather than with anything TSan said, and both pass serially. That is why
# the gate runs serially, and it is why neither was ever named as a finding.
#
# WHAT A GREEN RUN DOES NOT PROVE
#   * Nothing about Release. ASan runs Debug here. The four out-of-bounds found
#     on 2026-08-15 were live in Release and silent there precisely because they
#     were outside any ASSERT -- a green Debug sanitizer run says the code paths
#     TAKEN were clean, not that Release is.
#   * Less about TSan than it looks, even now it gates the whole label with
#     nothing excluded. A green tick means the code paths these 38 tests TAKE
#     were race-free on this run. TSan reports races it observes, not races
#     that exist: a lock order never exercised concurrently is a lock order it
#     cannot judge, which is how finding 1 sat unreported until the day the
#     preset was first run.
#   * Nothing about leaks in the fuzz harness -- see MscsUnitTests/CMakeLists.txt
#     for why detect_leaks is off for that one test, on purpose.
# =============================================================================

name: sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_REPO: IvywareAU/MscsSolution
  # No PLATFORM_REPO: the Platform repository was retired on 2026-09-03 and its
  # tree vendored into Msgcore, so the shim layer arrives with the Msgcore
  # checkout below and there is one fewer repository to hold a token for.
  MSGCORE_REPO: IvywareAU/Msgcore
  UNITTESTS_REPO: IvywareAU/MscsUnitTests
  # There is no KNOWN_FINDINGS and no exclusion list any more - see the banner.
  # The flags went with it rather than being left pointing at an empty variable.
  # Not because that would have broken: measured 2026-08-19, `ctest -L security
  # -E ""` still selected all 17 tests of that day, so an empty -E is a no-op and
  # leaving it would have been harmless.  (The label is 29 as of 2026-08-22; the
  # no-op result is a property of -E and does not depend on the count.)
  # It went because a gate should not carry an exclusion mechanism with
  # nothing in it - the next person to need one should have to add it deliberately,
  # and see the banner while doing so, rather than find a variable to fill in.
  #
  # That is what happened on 2026-09-17, and the paragraph above is left standing
  # rather than edited, because it is still true of ASan: the ASan gate excludes
  # nothing, on either platform. The list below belongs to the TSan job alone,
  # and was added deliberately, having read the banner.
  #
  # TEN TESTS, SIX DEFECTS. The first TSan run of the security label failed 10 of
  # 38 serially, and every failure is one of the six findings the banner lists.
  # Three of the six are one defect wearing three hats - hub teardown ordered by
  # KNOWN_TSAN IS GONE, and the promise it carried was kept: "delete a name the
  # moment its finding closes; the gate widens by itself and the step that
  # prints these disappears with the last one." All six findings closed over
  # 2026-09-17 and 18, so there is no list, no -E and no reports-only step. If
  # one is ever needed again, the banner above says what shape to rebuild it in.

jobs:
  windows-asan:
    name: Windows / MSVC + ASan
    runs-on: windows-2025-vs2026
    steps:
      - name: Preflight - can the cross-repository token actually reach the siblings?
        shell: bash
        env:
          TOKEN: ${{ secrets.MSCS_SOLUTION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MSCS_SOLUTION_TOKEN is not set on this repository."
            echo
            echo "Every MSCS repository is private, and the automatic GITHUB_TOKEN"
            echo "cannot read across repositories. The four checkout steps that"
            echo "follow would fail with a 404 that reads like a deleted repo."
            echo
            echo "Fix: create a PAT with read access to MscsSolution,"
            echo "Msgcore and MscsUnitTests, then:"
            echo "    gh secret set MSCS_SOLUTION_TOKEN --repo IvywareAU/Targetcore"
            exit 1
          fi
          echo "ok      MSCS_SOLUTION_TOKEN is present. Presence is not reach; checking reach."

          api() {
            curl -sS -o preflight.json -w '%{http_code}'                  -H "Authorization: Bearer $TOKEN"                  -H "Accept: application/vnd.github+json"                  -H "X-GitHub-Api-Version: 2022-11-28"                  "https://api.github.com/$1"
          }

          code=$(api user)
          if [ "$code" = "401" ]; then
            echo
            echo "FAIL    GitHub does not recognise this token at all (401 Bad credentials)."
            echo
            echo "        This is NOT a permissions problem, so granting the token access"
            echo "        to more repositories will not change it. The stored string is not"
            echo "        a usable token: expired, revoked, truncated when it was pasted,"
            echo "        or never replaced with a real value."
            echo
            echo "        Check the token before storing it again -- this prints the account"
            echo "        it belongs to, and never puts it in a shell history file:"
            echo "            read -rs TOK && GH_TOKEN=\$TOK gh api user --jq .login"
            echo "            read -rs TOK && GH_TOKEN=\$TOK gh api repos/IvywareAU/MscsSolution --jq .full_name"
            echo
            echo "        Then: gh secret set MSCS_SOLUTION_TOKEN --repo IvywareAU/Targetcore"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "FAIL    /user answered HTTP $code, which is neither 200 nor 401."
            exit 1
          fi
          echo "ok      the token authenticates, as: $(grep -o '"login"[^,]*' preflight.json | head -1 | cut -d'"' -f4)"

          echo
          echo "        reach, per repository the checkouts need:"
          missing=0
          for r in "$SOLUTION_REPO" "$MSGCORE_REPO" "$UNITTESTS_REPO"; do
            code=$(api "repos/$r")
            case "$code" in
              200) echo "          ok       $r" ;;
              404) echo "          NO READ  $r   (404 -- the token is valid but cannot see this one)"; missing=1 ;;
              *)   echo "          HTTP $code  $r"; missing=1 ;;
            esac
          done
          rm -f preflight.json
          if [ "$missing" != 0 ]; then
            echo
            echo "FAIL    the token authenticates but cannot read every sibling."
            echo "        A fine-grained PAT lists the repositories it may touch one by one;"
            echo "        add the ones marked NO READ above, with Contents: Read-only."
            echo "        Do not re-issue the token -- it works, its repository list is short."
            exit 1
          fi
          echo
          echo "ok      all three siblings are readable; the checkouts below cannot fail for credential reasons."

      - name: Check out the parent solution
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOLUTION_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs
      - name: Check out Msgcore
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MSGCORE_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs/Msgcore
      - name: Check out MscsUnitTests
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UNITTESTS_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs/MscsUnitTests
      - name: Check out Targetcore into the solution
        uses: actions/checkout@v5
        with:
          path: mscs/Targetcore

      - name: Verify the sibling layout
        shell: bash
        run: |
          missing=0
          for p in CMakeLists.txt CMakePresets.json Msgcore MscsUnitTests; do
            if [ -e "mscs/$p" ]; then echo "  ok      mscs/$p"
            else echo "  MISSING mscs/$p"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Nothing was built and nothing was verified."; exit 1; }

      - name: Configure (windows-msvc-asan)
        run: cmake --preset windows-msvc-asan
        working-directory: mscs

      - name: Build
        run: cmake --build --preset windows-msvc-asan
        working-directory: mscs

      # MSVC links /fsanitize=address code against clang_rt.asan_dynamic-x86_64.dll,
      # which lives in the MSVC toolchain and is NOT on PATH in a bare runner
      # shell. Without this the tests do not fail a sanitizer check -- they fail
      # to START, with a "cannot open shared object file" that reads like a build
      # error. Located rather than hardcoded: both the edition
      # (Community/Enterprise differ between this runner and a dev box) and the
      # 14.xx.xxxxx directory change with every toolchain bump.
      - name: Put the ASan runtime on PATH
        shell: bash
        run: |
          dll=$(find "/c/Program Files/Microsoft Visual Studio/18" \
                     -name 'clang_rt.asan_dynamic-x86_64.dll' -path '*Hostx64/x64*' \
                | head -1)
          if [ -z "$dll" ]; then
            echo "clang_rt.asan_dynamic-x86_64.dll not found in the VS 2026 toolchain."
            echo "Every ASan-instrumented test would fail to start. Refusing to"
            echo "continue and report that as a test result."
            exit 1
          fi
          echo "found: $dll"
          cygpath -w "$(dirname "$dll")" >> "$GITHUB_PATH"

      - name: Security label + fuzz harness under ASan (THE GATE)
        shell: bash
        run: |
          ctest --test-dir build/windows-msvc-asan -C Debug -L security \
                --output-on-failure --output-junit "$PWD/asan-windows.xml"
        working-directory: mscs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-windows
          path: mscs/asan-windows.xml
          if-no-files-found: warn

  linux-sanitizers:
    name: Linux / GCC + ASan+UBSan+LSan
    runs-on: ubuntu-latest
    steps:
      - name: Preflight - can the cross-repository token actually reach the siblings?
        shell: bash
        env:
          TOKEN: ${{ secrets.MSCS_SOLUTION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MSCS_SOLUTION_TOKEN is not set on this repository."
            echo
            echo "Every MSCS repository is private, and the automatic GITHUB_TOKEN"
            echo "cannot read across repositories. The four checkout steps that"
            echo "follow would fail with a 404 that reads like a deleted repo."
            echo
            echo "Fix: create a PAT with read access to MscsSolution,"
            echo "Msgcore and MscsUnitTests, then:"
            echo "    gh secret set MSCS_SOLUTION_TOKEN --repo IvywareAU/Targetcore"
            exit 1
          fi
          echo "ok      MSCS_SOLUTION_TOKEN is present. Presence is not reach; checking reach."

          api() {
            curl -sS -o preflight.json -w '%{http_code}'                  -H "Authorization: Bearer $TOKEN"                  -H "Accept: application/vnd.github+json"                  -H "X-GitHub-Api-Version: 2022-11-28"                  "https://api.github.com/$1"
          }

          code=$(api user)
          if [ "$code" = "401" ]; then
            echo
            echo "FAIL    GitHub does not recognise this token at all (401 Bad credentials)."
            echo
            echo "        This is NOT a permissions problem, so granting the token access"
            echo "        to more repositories will not change it. The stored string is not"
            echo "        a usable token: expired, revoked, truncated when it was pasted,"
            echo "        or never replaced with a real value."
            echo
            echo "        Check the token before storing it again -- this prints the account"
            echo "        it belongs to, and never puts it in a shell history file:"
            echo "            read -rs TOK && GH_TOKEN=\$TOK gh api user --jq .login"
            echo "            read -rs TOK && GH_TOKEN=\$TOK gh api repos/IvywareAU/MscsSolution --jq .full_name"
            echo
            echo "        Then: gh secret set MSCS_SOLUTION_TOKEN --repo IvywareAU/Targetcore"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "FAIL    /user answered HTTP $code, which is neither 200 nor 401."
            exit 1
          fi
          echo "ok      the token authenticates, as: $(grep -o '"login"[^,]*' preflight.json | head -1 | cut -d'"' -f4)"

          echo
          echo "        reach, per repository the checkouts need:"
          missing=0
          for r in "$SOLUTION_REPO" "$MSGCORE_REPO" "$UNITTESTS_REPO"; do
            code=$(api "repos/$r")
            case "$code" in
              200) echo "          ok       $r" ;;
              404) echo "          NO READ  $r   (404 -- the token is valid but cannot see this one)"; missing=1 ;;
              *)   echo "          HTTP $code  $r"; missing=1 ;;
            esac
          done
          rm -f preflight.json
          if [ "$missing" != 0 ]; then
            echo
            echo "FAIL    the token authenticates but cannot read every sibling."
            echo "        A fine-grained PAT lists the repositories it may touch one by one;"
            echo "        add the ones marked NO READ above, with Contents: Read-only."
            echo "        Do not re-issue the token -- it works, its repository list is short."
            exit 1
          fi
          echo
          echo "ok      all three siblings are readable; the checkouts below cannot fail for credential reasons."

      - name: Check out the parent solution
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOLUTION_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs
      - name: Check out Msgcore
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MSGCORE_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs/Msgcore
      - name: Check out MscsUnitTests
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UNITTESTS_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs/MscsUnitTests
      - name: Check out Targetcore into the solution
        uses: actions/checkout@v5
        with:
          path: mscs/Targetcore

      - name: Verify the sibling layout
        shell: bash
        run: |
          missing=0
          for p in CMakeLists.txt CMakePresets.json Msgcore MscsUnitTests; do
            if [ -e "mscs/$p" ]; then echo "  ok      mscs/$p"
            else echo "  MISSING mscs/$p"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Nothing was built and nothing was verified."; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config liburing-dev libssl-dev

      # linux-gcc-asan carries -fsanitize=address,undefined. LSan needs no flag
      # on Linux -- it rides along with ASan and is armed by detect_leaks=1 at
      # run time, which is set on the ctest steps below.
      - name: Configure (linux-gcc-asan = ASan + UBSan, LSan at runtime)
        run: cmake --preset linux-gcc-asan
        working-directory: mscs

      - name: Build
        run: cmake --build --preset linux-gcc-asan
        working-directory: mscs

      - name: Security label + fuzz harness under ASan+UBSan+LSan (THE GATE)
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:exitcode=23
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build/linux-gcc-asan -L security \
                --output-on-failure --timeout 600 \
                --output-junit "$PWD/asan-linux.xml"
        working-directory: mscs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-linux
          path: mscs/asan-linux.xml
          if-no-files-found: warn

  linux-tsan:
    name: Linux / GCC + TSan (pump/hub race gate)
    runs-on: ubuntu-latest
    steps:
      - name: Preflight - can the cross-repository token actually reach the siblings?
        shell: bash
        env:
          TOKEN: ${{ secrets.MSCS_SOLUTION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MSCS_SOLUTION_TOKEN is not set on this repository."
            echo
            echo "Every MSCS repository is private, and the automatic GITHUB_TOKEN"
            echo "cannot read across repositories. The four checkout steps that"
            echo "follow would fail with a 404 that reads like a deleted repo."
            echo
            echo "Fix: create a PAT with read access to MscsSolution,"
            echo "Msgcore and MscsUnitTests, then:"
            echo "    gh secret set MSCS_SOLUTION_TOKEN --repo IvywareAU/Targetcore"
            exit 1
          fi
          echo "ok      MSCS_SOLUTION_TOKEN is present. Presence is not reach; checking reach."

          api() {
            curl -sS -o preflight.json -w '%{http_code}'                  -H "Authorization: Bearer $TOKEN"                  -H "Accept: application/vnd.github+json"                  -H "X-GitHub-Api-Version: 2022-11-28"                  "https://api.github.com/$1"
          }

          code=$(api user)
          if [ "$code" = "401" ]; then
            echo
            echo "FAIL    GitHub does not recognise this token at all (401 Bad credentials)."
            echo
            echo "        This is NOT a permissions problem, so granting the token access"
            echo "        to more repositories will not change it. The stored string is not"
            echo "        a usable token: expired, revoked, truncated when it was pasted,"
            echo "        or never replaced with a real value."
            echo
            echo "        Check the token before storing it again -- this prints the account"
            echo "        it belongs to, and never puts it in a shell history file:"
            echo "            read -rs TOK && GH_TOKEN=\$TOK gh api user --jq .login"
            echo "            read -rs TOK && GH_TOKEN=\$TOK gh api repos/IvywareAU/MscsSolution --jq .full_name"
            echo
            echo "        Then: gh secret set MSCS_SOLUTION_TOKEN --repo IvywareAU/Targetcore"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "FAIL    /user answered HTTP $code, which is neither 200 nor 401."
            exit 1
          fi
          echo "ok      the token authenticates, as: $(grep -o '"login"[^,]*' preflight.json | head -1 | cut -d'"' -f4)"

          echo
          echo "        reach, per repository the checkouts need:"
          missing=0
          for r in "$SOLUTION_REPO" "$MSGCORE_REPO" "$UNITTESTS_REPO"; do
            code=$(api "repos/$r")
            case "$code" in
              200) echo "          ok       $r" ;;
              404) echo "          NO READ  $r   (404 -- the token is valid but cannot see this one)"; missing=1 ;;
              *)   echo "          HTTP $code  $r"; missing=1 ;;
            esac
          done
          rm -f preflight.json
          if [ "$missing" != 0 ]; then
            echo
            echo "FAIL    the token authenticates but cannot read every sibling."
            echo "        A fine-grained PAT lists the repositories it may touch one by one;"
            echo "        add the ones marked NO READ above, with Contents: Read-only."
            echo "        Do not re-issue the token -- it works, its repository list is short."
            exit 1
          fi
          echo
          echo "ok      all three siblings are readable; the checkouts below cannot fail for credential reasons."

      - name: Check out the parent solution
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOLUTION_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs
      - name: Check out Msgcore
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MSGCORE_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs/Msgcore
      - name: Check out MscsUnitTests
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UNITTESTS_REPO }}
          token: ${{ secrets.MSCS_SOLUTION_TOKEN }}
          path: mscs/MscsUnitTests
      - name: Check out Targetcore into the solution
        uses: actions/checkout@v5
        with:
          path: mscs/Targetcore

      - name: Verify the sibling layout
        shell: bash
        run: |
          missing=0
          for p in CMakeLists.txt CMakePresets.json Msgcore MscsUnitTests; do
            if [ -e "mscs/$p" ]; then echo "  ok      mscs/$p"
            else echo "  MISSING mscs/$p"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Nothing was built and nothing was verified."; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ninja-build pkg-config liburing-dev libssl-dev

      # linux-gcc-tsan carries -fsanitize=thread, and NOTHING else: TSan and ASan
      # both take over large parts of the address space, so one binary cannot
      # carry both. That is the whole reason this is a separate job and a
      # separate preset rather than another flag on linux-gcc-asan.
      - name: Configure (linux-gcc-tsan = ThreadSanitizer)
        run: cmake --preset linux-gcc-tsan
        working-directory: mscs

      - name: Build
        run: cmake --build --preset linux-gcc-tsan
        working-directory: mscs

      # THE GATE, AND IT IS NOW THE WHOLE LABEL. No -E, no KNOWN_TSAN, no
      # reports-only step: every test in the security label gates on every push,
      # exactly as the two ASan jobs do. It went 27 -> 28 -> the lot over two
      # days as the six findings closed, and the list that named them emptied
      # itself the way this file's ASan exclusion list did before it.
      #
      # Serial on purpose: at -j4 two tests failed on EADDRINUSE rather than on
      # anything TSan said, and a gate that is flaky about ports teaches people
      # to re-run it rather than read it.
      #
      # halt_on_error=0 collects every report in a run instead of stopping at the
      # first, and it does NOT do to TSan what it would do to ASan -- the note
      # beside linux-gcc-asan warns that halt_on_error=0 turns a leak report into
      # exit 0, which is true there and not here: TSan still exits 66 at the end
      # if it reported anything. Measured, not assumed: it is how the six were
      # enumerated in the first place.
      #
      # IF A FINDING IS EVER RAISED AGAIN, restore the pattern rather than
      # inventing one: a named exclusion in plain sight, plus a non-gating step
      # that prints its full report, plus a paragraph in the banner saying what
      # the defect IS. Do not just add a -E and move on.
      - name: Security label under TSan (THE GATE)
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=0:exitcode=66:second_deadlock_stack=1:history_size=4
        run: |
          ctest --test-dir build/linux-gcc-tsan -L security \
                --output-on-failure --timeout 600 \
                --output-junit "$PWD/tsan-linux.xml"
        working-directory: mscs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-linux
          path: |
            mscs/tsan-linux.xml
          if-no-files-found: warn
